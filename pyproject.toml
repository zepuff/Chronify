[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronify"
version = "0.1.0"
description = "A macOS menu bar work tracker: automatic time logging, local-AI daily statuses, PeopleForce sync and invoices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["macos", "menubar", "time-tracking", "timesheet", "invoice", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "rumps>=0.4.0",
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/zepuff/Chronify"
Issues = "https://github.com/zepuff/Chronify/issues"

[project.scripts]
chronify = "chronify.main:main"

[tool.setuptools]
packages = ["chronify"]

[tool.setuptools.package-data]
chronify = ["default_config.yaml", "templates/*.docx"]
